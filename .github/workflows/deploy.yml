name: Check and deploy static assets

on:
  push:
    branches: [main, integration/spec-1]
  pull_request:
    branches: [main, integration/spec-1]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (preview uses labelled synthetic fixtures)
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: static-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chrome
      # Browser checks build and validate BOTH static output directories.
      - run: npm run test:e2e
      - run: npm run deploy:dry-run
      - name: Deploy clearly labelled synthetic preview
        if: (github.event_name == 'push' && github.ref == 'refs/heads/integration/spec-1') || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npm run deploy:preview | tee /tmp/aib-deployment.log
          url=$(grep -Eo 'https://[[:alnum:]-]+\.[[:alnum:]-]+\.workers\.dev' /tmp/aib-deployment.log | tail -1)
          test -n "$url"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url" -o /tmp/aib-live.html
          cmp .qa-dist/index.html /tmp/aib-live.html
          printf 'Verified synthetic preview HTTPS URL: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy initial public question bank
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npm run deploy | tee /tmp/aib-deployment.log
          url=$(grep -Eo 'https://[[:alnum:]-]+\.[[:alnum:]-]+\.workers\.dev' /tmp/aib-deployment.log | tail -1)
          test -n "$url"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url" -o /tmp/aib-live.html
          cmp dist/index.html /tmp/aib-live.html
          printf 'Verified production HTTPS URL: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
